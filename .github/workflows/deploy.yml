name: Homepage auf almromantik.at hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten vorhanden?
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP-Zugangsdaten fehlen noch (Settings → Secrets → Actions). Upload übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Testseiten-Hinweise für die echte Homepage entfernen
        if: steps.check.outputs.ok == 'true'
        run: |
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i -E \
            -e 's#<meta name="robots" content="noindex, nofollow">##g' \
            -e 's#<div class="draft-note">[^<]*</div>##g'
          if [ -f robots.txt ]; then sed -i -E 's#^Disallow: /$#Disallow:#' robots.txt; fi
          echo "Rest-Treffer:"; grep -rl 'noindex\|draft-note">' --include=*.html . || true

      - name: Per FTP hochladen
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            social/**
            README.md
