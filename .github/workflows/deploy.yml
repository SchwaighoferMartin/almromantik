name: Homepage auf almromantik.at hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten vorhanden?
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP-Zugangsdaten fehlen noch (Settings → Secrets → Actions). Upload übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Testseiten-Hinweise für die echte Homepage entfernen
        if: steps.check.outputs.ok == 'true'
        run: |
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i -E \
            -e 's#<meta name="robots" content="noindex, nofollow">##g' \
            -e 's#<div class="draft-note">[^<]*</div>##g'
          if [ -f robots.txt ]; then sed -i -E 's#^Disallow: /$#Disallow:#' robots.txt; fi
          echo "Rest-Treffer:"; grep -rl 'noindex\|draft-note">' --include=*.html . || true

      - name: Per FTPS hochladen (lftp)
        if: steps.check.outputs.ok == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          mirror -R --parallel=4 --verbose=1 \
            --exclude-glob .git* --exclude-glob .git/ --exclude-glob .github/ \
            --exclude-glob social/ --exclude-glob README.md \
            ./ ${FTP_DIR:-./}
          bye
          EOF
